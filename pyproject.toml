[project]
name = "traval-asistant-of-mr-an"
version = "0.1.0"
description = "旅游助手 Agent 后端（FastAPI + DeepSeek）"
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "bcrypt>=5.0.0",
    "cryptography>=49.0.0",
    "fastapi>=0.139.0",
    "openai>=2.45.0",
    "passlib>=1.7.4",
    "pre-commit>=4.6.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "redis[hiredis]>=5.0",
    "sqlalchemy>=2.0",
    "tiktoken>=0.13.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
    "httpx>=0.28",
    "pytest-asyncio>=1.4.0",
    "pre-commit>=4.6.2",
]

[tool.uv]
managed = true
# 项目在 D 盘、uv 缓存在 C 盘时避免硬链接警告
link-mode = "copy"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend"]
# 只审查 backend，规避无关目录（虚拟环境、前端产物、缓存等）
extend-exclude = [".venv", "frontend", ".git", "build", "dist", "node_modules"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle 错误
    "W",     # pycodestyle 警告
    "F",     # pyflakes（未使用导入/变量等）
    "I",     # isort（导入排序）
    "UP",    # pyupgrade（现代语法）
    "B",     # flake8-bugbear（常见 bug 检测）
    "SIM",   # flake8-simplify（简化写法）
    "ASYNC", # flake8-async（asyncio 相关检查）
]
# 行宽由 ruff format 统一处理，关闭 E501，避免与格式化器冲突
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的 Depends/Query/Header 等是标准的默认参数用法，B008 不应视为错误
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.security.HTTPBasic",
    "fastapi.security.HTTPBearer",
    "fastapi.security.OAuth2PasswordBearer",
]

[tool.ruff.lint.per-file-ignores]
# 测试文件：允许在断言中写较长字符串，不强制过度简化
"backend/tests/**" = ["SIM", "E501"]

[tool.ruff.format]
# 与现有代码保持一致：统一使用双引号
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# 让所有异步 fixture 和测试共享同一个 session 级事件循环：
# conftest 的 test_engine 是 session 级 async engine（绑定到它创建时的 loop），
# 若测试跑在独立的 function 级 loop，收尾时跨 loop 关连接会报
# "RuntimeError: Future attached to a different loop"。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

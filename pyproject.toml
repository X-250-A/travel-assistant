[project]
name = "traval-asistant-of-mr-an"
version = "0.1.0"
description = "旅游助手 Agent 后端（FastAPI + DeepSeek）"
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "bcrypt>=5.0.0",
    "cryptography>=49.0.0",
    "fastapi>=0.139.0",
    "openai>=2.45.0",
    "passlib>=1.7.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
    "httpx>=0.28",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
managed = true
# 项目在 D 盘、uv 缓存在 C 盘时避免硬链接警告
link-mode = "copy"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
